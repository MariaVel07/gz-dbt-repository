
version: 2

sources:
  - name: gz_raw
    schema: gz_raw_data
    loader: bigquery
    tables:
      - name: sales
        identifier: raw_gz_sales 
        description: Greenweez sales table with products_id, orders_id, date, revenue and quantity
        tests:
          - unique:
              column_name: "(pdt_id||'-'||orders_id)"
        columns:
          - name: products_id
            description: unique identifier for each product
          - name: orders_id
            description: unique identifier for each order
          - name: date_date
            description: date of the purchase or sale was made
          - name: revenue
            description: the amount of money a client paid for each product
          - name: quantity
            description: the amount of products sold 
      - name: product
        identifier: raw_gz_product
        description: Greenweez products table, includes the products_id and purchase_price
        columns:
          - name: products_id
            description: unique identifier for each product
            tests:
              - not_null
              - unique
          - name: purchase_price
            description: the amount of money you pay per product
      - name: ship
        identifier: raw_gz_ship
        description: Greenweez's shipping table, includes oroders_id, the shipping_fee per order, the logistics costs and shipping costs
        columns: 
          - name: orders_id
            description: unique identifier for each order
            tests: 
              - not_null
              - unique
          - name: shipping_fee
            description: the fee the costumer pays for each order
          - name: logcost
            description: logistics costs incurred per order by the company
          - name: ship_cost
            description: shippping costs incurred per order by the company
